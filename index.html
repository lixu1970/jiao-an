<script>const KEY='lesson_collection_26271_2026_v1';
let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){state={}}
const checks=[...document.querySelectorAll('.check')];
let visibleMode={1:null,2:null,3:null,4:null,5:null};
function k(b){return b.dataset.person+'-'+b.dataset.task}
function renderButton(b){const on=!!state[k(b)];b.textContent=on?'✅':'□';b.classList.toggle('done',on);b.setAttribute('aria-pressed',on?'true':'false')}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function taskButtons(t){return checks.filter(b=>+b.dataset.task===t)}
function personName(b){return b.getAttribute('aria-label').replace(/ (2-4|5-8|9-12|13-16|17-20)$/,'')}
function updateStats(){for(let t=1;t<=5;t++){const arr=taskButtons(t);const done=arr.filter(b=>!!state[k(b)]).length;document.getElementById('done'+t).textContent=`完成（${done}）人`;document.getElementById('undone'+t).textContent=`未完成（${arr.length-done}）人`;}}
function renderList(t){const box=document.getElementById('list'+t),mode=visibleMode[t];if(!mode){box.style.display='none';return}const wantDone=mode==='done';const names=taskButtons(t).filter(b=>!!state[k(b)]===wantDone).map(b=>{const tr=b.closest('tr');let group=tr.querySelector('td.group');if(!group){let prev=tr.previousElementSibling;while(prev&&!prev.querySelector('td.group'))prev=prev.previousElementSibling;group=prev?.querySelector('td.group')}return (group?group.textContent.trim()+' ':'')+personName(b)});box.querySelector('b').textContent=wantDone?'已完成：':'未完成：';box.querySelector('span').textContent=names.length?names.join('、'):(wantDone?'暂无完成人员':'全部完成');box.style.display='block'}
function showDone(t){visibleMode[t]='done';updateStats();renderList(t)}
function showUndone(t){visibleMode[t]='undone';updateStats();renderList(t)}

function toggleAllTask(t){const arr=taskButtons(t),allDone=arr.every(b=>!!state[k(b)]);arr.forEach(b=>{if(allDone){delete state[k(b)]}else{state[k(b)]=true}renderButton(b)});save();updateStats();renderList(t)}
checks.forEach(b=>{renderButton(b);b.addEventListener('click',()=>{state[k(b)]=!state[k(b)];if(!state[k(b)])delete state[k(b)];renderButton(b);save();updateStats()})});
updateStats();</script></body></html>
